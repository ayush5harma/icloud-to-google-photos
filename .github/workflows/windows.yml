# The Windows port, checked on real Windows of both architectures: x64
# (windows-latest) and Arm64 (windows-11-arm, a Windows 11 Arm64 machine). What
# this proves and what it cannot (no hosted runner can boot an Android
# emulator, and Google publishes none for Windows on Arm) is listed in
# windows/DESIGN.md and the README's Windows section.
name: windows

on:
  push:
    paths:
      - 'windows/**'
      - 'bin/avd-photos-reclaim.py'
      - 'bin/avd-photos-setup'
      - 'lib/config.sh'
      - '.gitattributes'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'bin/avd-photos-reclaim.py'
      - 'bin/avd-photos-setup'
      - 'lib/config.sh'
      - '.gitattributes'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  windows:
    name: Windows ${{ matrix.arch }} (Pester, PSScriptAnalyzer, Python, reclaim path, architecture, SDK host)
    strategy:
      # One architecture's failure must not hide the other's result.
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: X64
            jdk: x64
          - runner: windows-11-arm
            arch: Arm64
            jdk: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # The device scripts must be LF even though Git for Windows checks text
      # out CRLF by default; Repo.Tests.ps1 asserts it, this shows the setting
      # it was asserted under.
      - name: Line-ending settings of this checkout
        run: |
          "core.autocrlf = $(git config --get core.autocrlf)"
          git ls-files --eol -- windows/device .gitattributes

      - name: Install Pester 5 and PSScriptAnalyzer
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 5.9.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          # Every run installs icloudpd and Python the way a new user would.
          enable-cache: false

      - name: Parse, PSScriptAnalyzer and Pester (WindowsOnly suites included)
        run: ./windows/tests/Invoke-Checks.ps1

      - name: Python tests
        env:
          PYTHONUTF8: '1'
        run: |
          $py = uv run --no-project --python 3.13 python -c "import platform; print(platform.machine(), platform.python_version())"
          $out = uv run --no-project --python 3.13 --with pytest pytest windows/tests/python -q
          $code = $LASTEXITCODE
          $out
          "::notice title=pytest (${{ matrix.arch }})::$([System.Runtime.InteropServices.RuntimeInformation]::OSDescription), Python $py`: $($out | Select-Object -Last 1)"
          exit $code

      - name: Reclaim invocation path (uv tool icloudpd, pinned library, empty list)
        run: ./windows/tests/Test-ReclaimImport.ps1

      # After the reclaim path, so uv, its Python 3.13 and icloudpd are there
      # to be read.
      - name: The machine's architecture, native and under emulation
        run: ./windows/tests/Test-HostArchitecture.ps1 -Expect ${{ matrix.arch }}

      # The JDK the README names (Microsoft's build of OpenJDK 21), in this
      # machine's architecture: on Windows on Arm the setup refuses any other.
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '21'
          architecture: ${{ matrix.jdk }}

      - name: What the setup fetches from Google, up to the emulator
        run: ./windows/tests/Test-SdkHost.ps1 -Expect ${{ matrix.arch }}

  python:
    name: Python and reclaim path (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          # Every run installs icloudpd and Python the way a new user would.
          enable-cache: false
      - name: Python tests
        run: |
          $out = uv run --no-project --python 3.13 --with pytest pytest windows/tests/python -q
          $code = $LASTEXITCODE
          $out
          "::notice title=pytest::$([System.Runtime.InteropServices.RuntimeInformation]::OSDescription): $($out | Select-Object -Last 1)"
          exit $code
      - name: Reclaim invocation path (uv tool icloudpd, pinned library, empty list)
        run: ./windows/tests/Test-ReclaimImport.ps1
      # The suites on an Apple Silicon Mac, WindowsOnly excluded: how the port
      # is checked before any Windows machine sees it (Invoke-Checks.ps1).
      - name: Install Pester 5 and PSScriptAnalyzer (macOS)
        if: runner.os == 'macOS'
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 5.9.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
      - name: Parse, PSScriptAnalyzer and Pester (macOS)
        if: runner.os == 'macOS'
        run: ./windows/tests/Invoke-Checks.ps1
